
name: Generate MalaTrade Android Release Keystore

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  generate-keystore:
    name: Generate Android Release Keystore
    runs-on: ubuntu-latest

    steps:
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Generate MalaTrade release keystore
        env:
          STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$STORE_PASSWORD" || exit 1
          test -n "$KEY_PASSWORD" || exit 1

          keytool -genkeypair \
            -v \
            -keystore malatrade-release.jks \
            -storetype JKS \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias malatrade \
            -storepass "$STORE_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -dname "CN=MalaTrade, OU=Mobile, O=MalaTrade, L=Mangochi, ST=Malawi, C=MW"

          echo "MalaTrade release keystore generated successfully."

      - name: Upload release keystore
        uses: actions/upload-artifact@v4
        with:
          name: malatrade-release-keystore
          path: malatrade-release.jks
          retention-days: 7
