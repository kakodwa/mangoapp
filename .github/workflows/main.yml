
name: Flutter Multi-Platform Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:

  # ============================================================
  # ANDROID BUILD
  # ============================================================
  build-android:
    name: Build Android (APK & AAB)
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Set up Java
      # --------------------------------------------------------
      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------------
      # Set up Gradle caching
      # --------------------------------------------------------
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # --------------------------------------------------------
      # Set up Flutter
      # --------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          cache: true

      # --------------------------------------------------------
      # Get Flutter dependencies
      # --------------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------------
      # Configure Android Release Signing
      # --------------------------------------------------------
      - name: Configure Android release signing
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -e

          test -n "$KEYSTORE_BASE64" || (echo "Missing keystore secret" && exit 1)
          test -n "$KEYSTORE_PASSWORD" || (echo "Missing keystore password" && exit 1)
          test -n "$KEY_ALIAS" || (echo "Missing key alias" && exit 1)
          test -n "$KEY_PASSWORD" || (echo "Missing key password" && exit 1)

          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > android/app/malatrade-release.jks

          test -s android/app/malatrade-release.jks

          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=malatrade-release.jks
          EOF

          echo "Android release signing configured successfully."

      # --------------------------------------------------------
      # Build AAB with retry
      # --------------------------------------------------------
      - name: Build Android App Bundle (AAB)
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "========================================"
            echo "AAB BUILD ATTEMPT $attempt OF 3"
            echo "========================================"

            if flutter build appbundle --release --no-pub; then
              echo "AAB build completed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "AAB build failed. Waiting 60 seconds before retry..."
              sleep 60
            fi
          done

          echo "AAB build failed after 3 attempts."
          exit 1

      # --------------------------------------------------------
      # Build APK with retry
      # --------------------------------------------------------
      - name: Build Android APK
        run: |
          set -e

          for attempt in 1 2 3; do
            echo "========================================"
            echo "APK BUILD ATTEMPT $attempt OF 3"
            echo "========================================"

            if flutter build apk --release --no-pub; then
              echo "APK build completed successfully."
              exit 0
            fi

            if [ "$attempt" -lt 3 ]; then
              echo "APK build failed. Waiting 60 seconds before retry..."
              sleep 60
            fi
          done

          echo "APK build failed after 3 attempts."
          exit 1

      # --------------------------------------------------------
      # Verify Android release files
      # --------------------------------------------------------
      - name: Verify Android release files
        run: |
          set -e

          test -s build/app/outputs/bundle/release/app-release.aab
          test -s build/app/outputs/flutter-apk/app-release.apk

          echo "Android release files generated successfully."

          ls -lh build/app/outputs/bundle/release/app-release.aab
          ls -lh build/app/outputs/flutter-apk/app-release.apk

      # --------------------------------------------------------
      # Upload AAB
      # --------------------------------------------------------
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: malatrade-android-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 30

      # --------------------------------------------------------
      # Upload APK
      # --------------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: malatrade-android-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 30


  # ============================================================
  # iOS BUILD
  # ============================================================
  build-ios:
    name: Build iOS IPA
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Set up Flutter
      # --------------------------------------------------------
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.41.7
          cache: true

      # --------------------------------------------------------
      # Get dependencies
      # --------------------------------------------------------
      - name: Get dependencies
        run: flutter pub get

      # --------------------------------------------------------
      # Install Apple certificate
      # --------------------------------------------------------
      - name: Install Apple certificate
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          set -e

          test -n "$IOS_CERTIFICATE_BASE64" || (echo "Missing iOS certificate" && exit 1)
          test -n "$IOS_CERTIFICATE_PASSWORD" || (echo "Missing iOS certificate password" && exit 1)

          CERTIFICATE_PATH="$RUNNER_TEMP/certificate.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"

          printf '%s' "$IOS_CERTIFICATE_BASE64" | base64 --decode > "$CERTIFICATE_PATH"

          test -s "$CERTIFICATE_PATH"

          openssl pkcs12 \
            -in "$CERTIFICATE_PATH" \
            -info \
            -noout \
            -passin pass:"$IOS_CERTIFICATE_PASSWORD"

          security create-keychain -p "temporary" "$KEYCHAIN_PATH"

          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"

          security unlock-keychain -p "temporary" "$KEYCHAIN_PATH"

          security import "$CERTIFICATE_PATH" \
            -P "$IOS_CERTIFICATE_PASSWORD" \
            -A -t cert -f pkcs12 \
            -k "$KEYCHAIN_PATH"

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s -k "temporary" "$KEYCHAIN_PATH"

          security list-keychain -d user -s "$KEYCHAIN_PATH"

          echo "Apple certificate installed."

      # --------------------------------------------------------
      # Install provisioning profile
      # --------------------------------------------------------
      - name: Install provisioning profile
        env:
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -e

          test -n "$IOS_PROVISIONING_PROFILE_BASE64" || (echo "Missing provisioning profile" && exit 1)

          PROFILE_PATH="$RUNNER_TEMP/profile.mobileprovision"

          printf '%s' "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > "$PROFILE_PATH"

          test -s "$PROFILE_PATH"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"

          cp "$PROFILE_PATH" \
            "$HOME/Library/MobileDevice/Provisioning Profiles/"

          echo "Provisioning profile installed."

      # --------------------------------------------------------
      # Check Xcode signing identities
      # --------------------------------------------------------
      - name: Check signing identities
        run: |
          security find-identity -v -p codesigning \
            "$RUNNER_TEMP/build.keychain-db"

      # --------------------------------------------------------
      # Build signed IPA
      # --------------------------------------------------------
      - name: Build iOS IPA
        run: flutter build ipa --release

      # --------------------------------------------------------
      # Verify generated IPA
      # --------------------------------------------------------
      - name: Check IPA
        run: |
          set -e
          ls -lh build/ios/ipa/
          test -n "$(find build/ios/ipa -name '*.ipa' -type f)"

      # --------------------------------------------------------
      # Upload IPA
      # --------------------------------------------------------
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: malatrade-ios-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
